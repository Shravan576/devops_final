global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager configuration (optional placeholder)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Alert rules files
rule_files:
  # - "alert_rules.yml"

# Scrape configurations: targets to monitor
scrape_configs:
  # Scrape Prometheus own metrics
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Scrape Nginx metrics exposed via nginx-prometheus-exporter container
  - job_name: "nginx-exporter"
    static_configs:
      - targets: ["nginx-exporter:9113"]

  # Scrape container metrics via Kubernetes cAdvisor agent (production configuration)
  - job_name: "kubernetes-cadvisor"
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
