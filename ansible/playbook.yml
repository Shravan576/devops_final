---
- name: Configure AWS EC2 Server and Deploy E-Commerce Web Stack
  hosts: webservers
  become: yes
  tasks:

    - name: Update apt software package cache
      apt:
        update_cache: yes
        force_apt_get: yes

    - name: Install prerequisite packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - git
        state: present

    - name: Check if Docker GPG key directory exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker GPG key signature
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present
        keyring: /etc/apt/keyrings/docker.gpg

    - name: Set up Docker APT repository setup
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker engines and plugins
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Ensure Docker service daemon is started and enabled
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add Ubuntu user to Docker group access list
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Check if project repo target directory exists
      file:
        path: /opt/devops-ecommerce
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Clone DevOps project codebase from GitHub repository
      git:
        repo: 'https://github.com/Shravan576/devops_final.git'
        dest: /opt/devops-ecommerce
        version: main
        force: yes
      become_user: ubuntu

    - name: Stop any existing running container stacks
      command: docker compose down
      args:
        chdir: /opt/devops-ecommerce
      ignore_errors: yes
      become_user: ubuntu

    - name: Deploy container stack via Docker Compose
      command: docker compose up -d --build
      args:
        chdir: /opt/devops-ecommerce
      become_user: ubuntu

    - name: Confirm Docker containers status check
      command: docker ps
      register: docker_status
      become_user: ubuntu

    - name: Output active container list
      debug:
        var: docker_status.stdout_lines
